server {
    listen 80;
    server_name your-domain.ru www.your-domain.ru;

    # После получения SSL через certbot эта секция заменится автоматически
    # certbot --nginx -d your-domain.ru -d www.your-domain.ru

    location /_next/static/ {
        alias /var/www/marco_web/marco-site/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        alias /var/www/marco_web/marco-site/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
